name: Backend CI/CD

# Deploys new Cloud Run revisions with --no-traffic: they get their own
# revision URL to verify against before any live traffic is routed to them.
# Promote a verified revision to live traffic separately (see the
# "promote" job, triggered manually via workflow_dispatch).
#
# Prerequisites not yet in place (tracked separately):
#   - Cloud SQL instance (bcf-postgres) must exist
#   - Workload Identity Federation pool/provider for keyless GitHub->GCP auth
#     (needs an IAM-admin-level grant to set up; blocked on the same
#     permission gap as the Cloud SQL networking setup)
#   - GitHub repo secrets: WIF_PROVIDER, GCP_SERVICE_ACCOUNT

on:
  push:
    branches: [dev]
    paths:
      - 'backend/**'
  workflow_dispatch:
    inputs:
      promote_revision:
        description: 'Revision suffix to promote to 100% live traffic (leave empty to just build+deploy with no traffic)'
        required: false
        type: string

env:
  PROJECT_ID: becausefuture
  REGION: europe-west10
  SERVICE: bcf-backend
  IMAGE: europe-west10-docker.pkg.dev/becausefuture/bcf-backend/backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Compile check
        working-directory: backend
        run: |
          python -m py_compile app.py
          find shared features scripts -name "*.py" -print0 | xargs -0 -n1 python -m py_compile

      - name: Run tests
        working-directory: backend
        run: |
          if find tests -name "test_*.py" | grep -q .; then
            pytest tests/ -q
          else
            echo "No tests present yet - skipping (compile check above still gates the build)"
          fi

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'
    permissions:
      contents: read
      id-token: write  # required for keyless Workload Identity Federation auth
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west10-docker.pkg.dev --quiet

      - name: Build and push image
        working-directory: backend
        run: |
          docker build -t "${IMAGE}:${GITHUB_SHA}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

      - name: Deploy new revision (no traffic)
        run: |
          gcloud run deploy "${SERVICE}" \
            --image="${IMAGE}:${GITHUB_SHA}" \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --no-traffic \
            --tag="sha-${GITHUB_SHA::12}" \
            --service-account="bcf-cloudrun@becausefuture.iam.gserviceaccount.com" \
            --add-cloudsql-instances="${PROJECT_ID}:${REGION}:bcf-postgres" \
            --set-secrets="DATABASE_URL=DATABASE_URL:latest,SECRET_KEY=SECRET_KEY:latest,JWT_SECRET_KEY=JWT_SECRET_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,MIXER_SERVICE_USERNAME=MIXER_SERVICE_USERNAME:latest,MIXER_SERVICE_PASSWORD=MIXER_SERVICE_PASSWORD:latest" \
            --set-env-vars="FLASK_ENV=production,FLASK_DEBUG=false,GCS_BUCKET_NAME=bcf-images-prod,CORS_ORIGINS=https://server.becausefuture.tech"

      - name: Print new revision URL for manual verification
        run: |
          gcloud run services describe "${SERVICE}" --region="${REGION}" --project="${PROJECT_ID}" \
            --format="value(status.traffic)" | grep "sha-${GITHUB_SHA::12}" || true
          echo "Verify the new revision at its tagged URL before promoting traffic."
          echo "Promote via: gh workflow run backend-deploy.yml -f promote_revision=sha-${GITHUB_SHA::12}"

  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.promote_revision != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Shift 100% traffic to the specified revision
        run: |
          gcloud run services update-traffic "${SERVICE}" \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --to-tags="${{ inputs.promote_revision }}=100"
